name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run build

      # Install the library into the example as a packed tarball, like a published package.
      - run: bun pm pack --destination example
      - working-directory: example
        run: |
          bun remove react-native-image-comparison
          bun add ./react-native-image-comparison-$(node -p "require('../package.json').version").tgz

      - working-directory: example
        run: bunx tsc --noEmit

      # tsc doesn't run the Worklets Babel plugin; bundling does.
      - working-directory: example
        run: |
          bunx expo export --platform ios --output-dir "$RUNNER_TEMP/ios" --clear
          bunx expo export --platform web --output-dir "$RUNNER_TEMP/web" --clear
